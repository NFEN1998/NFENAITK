<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-site-name" content="{{.SiteName}}">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/user/static/user.css">
<script>try{var a=localStorage.getItem("nfentik-accent");if(a)document.documentElement.dataset.accent=a}catch(e){}</script>
</head>
<body data-page="login" data-site-name="{{.SiteName}}">
<div class="login-page">
  <aside class="login-brand">
    <a class="brand" href="/user">
      <span class="brand-mark">N</span>
      <div><strong>{{.SiteName}}</strong><small>用户中心</small></div>
    </a>
    <div>
      <h1>你的题库账户，<br>清楚、安静、随时可用。</h1>
      <p>登录后查看套餐额度、管理用户令牌，并把 OCS 或 URL 接入配置复制到你的查询工具里。</p>
      <ul>
        <li>套餐、次数与到期时间一目了然</li>
        <li>一次配置，支持 OCS 与 MOGO</li>
        <li>调用记录可查，额度使用透明</li>
      </ul>
    </div>
    <div class="foot">{{.SiteName}} · 智能题库查询服务</div>
  </aside>

  <div class="login-form-wrap">
    <div class="login-card">
      <h2>欢迎回来</h2>
      <p class="sub">使用用户令牌或账号密码登录。</p>

      <div class="login-tabs" data-login-tabs>
        <button class="active" data-login-tab="token">令牌登录</button>
        <button data-login-tab="account">账号登录</button>
        <button data-login-tab="register">注册</button>
      </div>

      <div class="login-panel active" data-login-pane="token">
        <div class="field">
          <label for="user-token">用户令牌</label>
          <div class="pw-wrap">
            <input id="user-token" type="password" autocomplete="off" placeholder="请输入用户令牌">
            <button class="pw-toggle" type="button" data-pw-toggle="user-token">显示</button>
          </div>
          <span class="help">令牌由管理员分配，或注册后自动生成。</span>
        </div>
        <button id="user-login-btn" class="btn primary login-submit">进入用户中心</button>
        <p id="user-login-error" class="error" style="color:var(--danger);min-height:18px"></p>
      </div>

      <div class="login-panel" data-login-pane="account">
        <div class="field">
          <label for="account-username">用户名</label>
          <input id="account-username" type="text" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="field">
          <label for="account-password">密码</label>
          <div class="pw-wrap">
            <input id="account-password" type="password" placeholder="请输入密码" autocomplete="current-password">
            <button class="pw-toggle" type="button" data-pw-toggle="account-password">显示</button>
          </div>
        </div>
        <button id="account-login-btn" class="btn primary login-submit">账号登录</button>
        <p id="account-login-error" class="error" style="color:var(--danger);min-height:18px"></p>
      </div>

      <div class="login-panel" data-login-pane="register">
        <div class="field">
          <label for="register-username">用户名</label>
          <input id="register-username" type="text" placeholder="字母开头，3-32 位" autocomplete="username">
        </div>
        <div class="field">
          <label for="register-password">密码</label>
          <div class="pw-wrap">
            <input id="register-password" type="password" placeholder="至少 8 位" autocomplete="new-password">
            <button class="pw-toggle" type="button" data-pw-toggle="register-password">显示</button>
          </div>
        </div>
        <div class="field">
          <label for="register-password2">确认密码</label>
          <input id="register-password2" type="password" placeholder="再次输入密码" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="register-token">已有令牌（可选）</label>
          <input id="register-token" type="password" placeholder="填写后绑定已有令牌" autocomplete="off">
        </div>
        <button id="register-btn" class="btn primary login-submit">注册并登录</button>
        <p id="register-error" class="error" style="color:var(--danger);min-height:18px"></p>
      </div>

      <div class="login-foot">登录即表示你已阅读并同意服务条款</div>
    </div>
  </div>
</div>
<div class="toast" data-toast-host></div>
<script src="/user/static/user.js"></script>
</body>
</html>
